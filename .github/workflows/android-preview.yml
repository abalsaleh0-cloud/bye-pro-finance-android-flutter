name: Android Preview APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-preview:
    name: Manual ARM64 profile preview APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'
          cache-provider: basic

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.0
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localization sources
        run: flutter gen-l10n

      - name: Generate Drift database code
        run: dart run build_runner build

      - name: Format Dart sources
        run: dart format .

      - name: Analyze Dart sources
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

      - name: Build ARM64 profile preview APK
        run: flutter build apk --profile --flavor preview --target-platform android-arm64

      - name: Upload preview APK
        uses: actions/upload-artifact@v4
        with:
          name: bye-pro-finance-preview-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-preview-profile.apk
          if-no-files-found: error
          retention-days: 14
