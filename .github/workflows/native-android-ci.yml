name: Native Android CI

on:
  pull_request:
    paths:
      - "native-android/**"
      - ".github/workflows/native-android-ci.yml"
  push:
    branches:
      - feature/native-android-rebuild
      - main
    paths:
      - "native-android/**"
      - ".github/workflows/native-android-ci.yml"

permissions:
  contents: read

concurrency:
  group: native-android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"
          cache-provider: basic

      - name: Assemble native debug APK
        run: gradle -p native-android :app:assembleDebug --no-daemon

      - name: Upload native preview APK
        uses: actions/upload-artifact@v4
        with:
          name: bye-pro-finance-native-preview
          path: native-android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
