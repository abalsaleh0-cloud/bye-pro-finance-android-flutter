name: Flutter CI

on:
  push:
    branches:
      - main
      - feature/task-5-drift-database-foundation
      - feature/task-6-financial-ui-integration
      - feature/task-7-financial-crud
      - feature/task-8-work-home-transfers
      - feature/task-9-monthly-dashboard
      - feature/task-10-debt-payment-history
  pull_request:

permissions:
  contents: write

concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: subosito/flutter-action@v2
        env:
          FLUTTER_STORAGE_BASE_URL: https://storage.flutter-io.cn
        with:
          channel: stable
          flutter-version: 3.50.0
          cache: true
      - run: flutter pub get
      - name: Generate localization sources
        run: flutter gen-l10n
      - name: Generate Drift database code
        run: dart run build_runner build
      - name: Format Dart sources
        run: dart format .
      - run: flutter analyze
      - name: Run Flutter tests with per-test timeout and progress output
        run: flutter test --reporter expanded --timeout 90s
      - name: Commit generated and formatted sources
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/feature/task-')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib test
          if ! git diff --cached --quiet; then
            git commit -m "build: generate and format Drift database sources"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
