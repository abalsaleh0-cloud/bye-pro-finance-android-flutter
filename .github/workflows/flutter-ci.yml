name: Flutter CI

on:
  push:
    branches:
      - main
      - feature/task-5-drift-database-foundation
  pull_request:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: subosito/flutter-action@v2
        env:
          FLUTTER_STORAGE_BASE_URL: https://storage.flutter-io.cn
        with:
          channel: stable
          flutter-version: 3.50.0
          cache: true
      - run: flutter pub get
      - name: Generate Drift database code
        run: dart run build_runner build --delete-conflicting-outputs
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test
      - name: Commit generated Drift code
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/task-5-drift-database-foundation'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/core/database/app_database.g.dart
          if ! git diff --cached --quiet; then
            git commit -m "build: generate Drift database code"
            git push origin feature/task-5-drift-database-foundation
          fi
