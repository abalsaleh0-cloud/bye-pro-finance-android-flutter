name: Android Release

on:
  workflow_dispatch:
  # One-time automatic production build when the corrected release workflow
  # is merged to main. The path filter avoids building a production APK on
  # every subsequent application commit.
  push:
    branches:
      - main
    paths:
      - .github/workflows/android-release.yml

permissions:
  contents: read

jobs:
  build-release:
    name: Build signed Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      # Android Gradle Plugin 9.3.1's release lint path uses Java 21 APIs.
      # Pin the JDK rather than relying on the runner's preinstalled default.
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        env:
          FLUTTER_STORAGE_BASE_URL: https://storage.flutter-io.cn
        with:
          channel: stable
          flutter-version: 3.50.0
          cache: true

      - name: Restore and validate release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_PATH: ${{ runner.temp }}/bye-pro-release-keystore.jks
        run: |
          set -euo pipefail

          if [[ -z "${KEYSTORE_BASE64:-}" || -z "${KEYSTORE_PASSWORD:-}" || -z "${KEY_PASSWORD:-}" || -z "${KEY_ALIAS:-}" ]]; then
            echo "::error::Android release signing secrets are missing. Configure KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_PASSWORD, and KEY_ALIAS."
            exit 1
          fi

          if ! printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"; then
            echo "::error::The Base64 keystore secret could not be decoded."
            exit 1
          fi

          chmod 600 "$KEYSTORE_PATH"

          if [[ ! -s "$KEYSTORE_PATH" ]]; then
            echo "::error::The decoded keystore file is empty."
            exit 1
          fi

          if ! keytool -list -keystore "$KEYSTORE_PATH" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null 2>&1; then
            echo "::error::The keystore is invalid, the password is incorrect, or the configured alias does not exist."
            exit 1
          fi

          echo "Release keystore and alias validated successfully."

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localization sources
        run: flutter gen-l10n

      - name: Generate Drift database code
        run: dart run build_runner build

      - name: Format Dart sources
        run: dart format .

      - name: Analyze Dart sources
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

      - name: Validate Android launcher PNG resources
        shell: python
        run: |
          from pathlib import Path
          import struct
          import zlib

          resource_root = Path("android/app/src/main/res")
          png_files = sorted(resource_root.rglob("*.png"))
          if not png_files:
              raise SystemExit("No Android PNG resources were found.")

          for path in png_files:
              data = path.read_bytes()
              if data[:8] != b"\\x89PNG\\r\\n\\x1a\\n":
                  raise SystemExit(f"Invalid PNG signature: {path}")

              chunks = []
              offset = 8
              saw_iend = False
              while offset + 12 <= len(data):
                  length = struct.unpack(">I", data[offset:offset + 4])[0]
                  end = offset + 8 + length
                  if end + 4 > len(data):
                      raise SystemExit(f"Truncated PNG chunk in {path}")

                  chunk_type = data[offset + 4:offset + 8]
                  expected_crc = struct.unpack(">I", data[end:end + 4])[0]
                  actual_crc = zlib.crc32(data[offset + 4:end]) & 0xffffffff
                  if actual_crc != expected_crc:
                      raise SystemExit(f"PNG CRC mismatch in {path} ({chunk_type!r})")

                  chunks.append(chunk_type)
                  offset = end + 4
                  if chunk_type == b"IEND":
                      saw_iend = True
                      break

              if not saw_iend or offset != len(data) or not chunks or chunks[0] != b"IHDR":
                  raise SystemExit(f"Invalid PNG chunk structure: {path}")

          print(f"Validated {len(png_files)} Android PNG resources and all chunk CRCs.")
          
      - name: Build signed production ARM64 APK
        shell: bash
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/bye-pro-release-keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          flutter build apk --release --flavor production --target-platform android-arm64

      - name: Verify production package and signing identity
        shell: bash
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/bye-pro-release-keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-production-release.apk"
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          BUILD_TOOLS_DIR="$(find "$SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"
          APKSIGNER="$BUILD_TOOLS_DIR/apksigner"
          AAPT="$BUILD_TOOLS_DIR/aapt"

          if [[ ! -s "$APK" ]]; then
            echo "::error::The production-flavor APK was not created at the expected path."
            exit 1
          fi

          SIGNER_OUTPUT="$("$APKSIGNER" verify --verbose --print-certs "$APK")"
          APK_FINGERPRINT="$(printf '%s\n' "$SIGNER_OUTPUT" | awk -F': ' '/certificate SHA-256 digest:/ {print $NF; exit}' | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          KEY_FINGERPRINT="$(keytool -exportcert -alias "$KEY_ALIAS" -keystore "$KEYSTORE_PATH" -storepass "$KEYSTORE_PASSWORD" | openssl dgst -sha256 | awk '{print $NF}' | tr '[:upper:]' '[:lower:]')"

          if [[ -z "$APK_FINGERPRINT" || "$APK_FINGERPRINT" != "$KEY_FINGERPRINT" ]]; then
            echo "::error::The production APK signing certificate does not match the configured original production key."
            exit 1
          fi

          BADGING="$("$AAPT" dump badging "$APK" | sed -n '1p')"
          printf '%s\n' "$BADGING"
          if [[ "$BADGING" != *"name='com.byepro.bye_pro_finance'"* ]]; then
            echo "::error::The APK package ID is not the original production application ID."
            exit 1
          fi
          if [[ "$BADGING" == *".preview"* ]]; then
            echo "::error::A preview APK cannot be delivered as the production update."
            exit 1
          fi

          echo "Production package ID and signing certificate verified."
          sha256sum "$APK" | tee "$GITHUB_STEP_SUMMARY"

      - name: Upload original production APK
        uses: actions/upload-artifact@v4
        with:
          name: bye-pro-finance-production-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-production-release.apk
          if-no-files-found: error
          retention-days: 30
