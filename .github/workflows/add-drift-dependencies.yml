name: Add Drift dependencies

on:
  push:
    branches:
      - chore/add-drift-dependencies
    paths:
      - .github/workflows/add-drift-dependencies.yml

permissions:
  contents: write

jobs:
  add-dependencies:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/add-drift-dependencies
      - uses: subosito/flutter-action@v2
        env:
          FLUTTER_STORAGE_BASE_URL: https://storage.flutter-io.cn
        with:
          channel: stable
          flutter-version: 3.50.0
          cache: true
      - name: Add runtime dependencies
        run: flutter pub add drift drift_flutter
      - name: Add development dependencies
        run: flutter pub add --dev drift_dev build_runner
      - name: Verify dependency resolution
        run: flutter pub get
      - name: Format
        run: dart format .
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Commit resolved dependency files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pubspec.yaml pubspec.lock
          if git diff --cached --quiet; then
            echo "No dependency changes to commit."
          else
            git commit -m "chore: add Drift dependencies"
            git push origin HEAD:chore/add-drift-dependencies
          fi
